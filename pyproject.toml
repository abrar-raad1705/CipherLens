[project]
name = "bat-signal"
version = "0.1.0"
description = "2D signal processing and image encryption analysis platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batsignal"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
